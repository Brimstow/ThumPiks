[build]
  publish = "dist"
  command = "chmod +x scripts/netlify-build.sh && ./scripts/netlify-build.sh"

# ═══════════════════════════════════════════════════════════════════
# PROXY ARCHITECTURE (Safari ITP fix + CSRF hardening)
# ═══════════════════════════════════════════════════════════════════
# All API requests go through Netlify proxy → Railway backend.
# This makes cookies first-party (fixes Safari ITP blocking) and
# allows sameSite=lax (closes CSRF vector from sameSite=none).
#
# VITE_API_URL="" → frontend uses relative /api/* paths
# API_PROXY_TARGET  → build script writes _redirects with proxy rule
# ═══════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════
# CROSS-ORIGIN ISOLATION (SharedArrayBuffer / FFmpeg.wasm)
# ═══════════════════════════════════════════════════════════════════
# COOP + COEP enable window.crossOriginIsolated = true, which is
# required for SharedArrayBuffer (multi-threaded FFmpeg.wasm).
#
# "credentialless" (vs "require-corp") is intentional:
#   • Chrome 110+ / Firefox 119+: crossOriginIsolated = true ✅
#   • Does NOT block cross-origin resources (Google Fonts, Cloudinary,
#     unpkg CDN, analytics) — only strips credentials from them.
#   • Safari does NOT support "credentialless" and will ignore it,
#     so crossOriginIsolated stays false → FFmpeg falls back to
#     single-threaded mode automatically (see video-service.ts).
# ═══════════════════════════════════════════════════════════════════

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "22"
  CI = ""

# Cross-origin isolation headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# ═══════════════════════════════════════════════════════════════════
# PRE-LAUNCH CLOAK (thumpiks.com) — REMOVE AT PRIMETIME
# ═══════════════════════════════════════════════════════════════════
# Keeps the site out of search engines and AI indexes until launch.
# PAIRED WITH: client/public/robots.txt (Disallow: /) — update BOTH at launch.
# Launch checklist: 1) delete this header block  2) empty public/robots.txt
#   Disallow  3) add sitemap.xml on the live host  4) submit in Google
#   Search Console  5) verify via `curl -sI thumpiks.com | grep -i x-robots`.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Admin SPA fallback (must be before the main catch-all)
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Main SPA fallback (overridden by build script when API_PROXY_TARGET is set)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ═══════════════════════════════════════════════════════════════════
# DEPLOY CONTEXT SETTINGS
# ═══════════════════════════════════════════════════════════════════

# Production context
[context.production]
  command = "chmod +x scripts/netlify-build.sh && ./scripts/netlify-build.sh"

[context.production.environment]
  NODE_ENV = "production"
  VITE_ENV = "production"
  VITE_API_URL = ""
  # TEMP: domain launch points the API at the staging backend until primetime.
  # REVERT to https://thumbnail-maker-studio-production.up.railway.app after
  # the production Railway env is refreshed (Polar token, Google OAuth, CORS).
  API_PROXY_TARGET = "https://thumbnail-maker-studio-staging.up.railway.app"

# Deploy Preview context - for PR previews
[context.deploy-preview]
  command = "chmod +x scripts/netlify-build.sh && ./scripts/netlify-build.sh"

[context.deploy-preview.environment]
  NODE_ENV = "production"
  VITE_ENV = "preview"
  VITE_API_URL = ""
  API_PROXY_TARGET = "https://thumbnail-maker-studio-staging.up.railway.app"

# Branch deploy context (staging)
[context.branch-deploy]
  command = "chmod +x scripts/netlify-build.sh && ./scripts/netlify-build.sh"

[context.branch-deploy.environment]
  NODE_ENV = "production"
  VITE_ENV = "staging"
  VITE_API_URL = ""
  API_PROXY_TARGET = "https://thumbnail-maker-studio-staging.up.railway.app"
