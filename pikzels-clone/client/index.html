<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thumbnail Maker Studio</title>
    
    <!-- Google Fonts for Dashboard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;900&family=Instrument+Serif:wght@400;500;600;700&family=Merriweather:wght@300;400;700;900&family=Bricolage+Grotesque:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700;800&family=PT+Serif:wght@400;700&family=Geist+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Bangers&family=Bebas+Neue&family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- SVG Sharpen Filters for Editor Adjustments Panel -->
    <svg style="display:none" aria-hidden="true">
      <defs>
        <!-- Light sharpen: subtle enhancement -->
        <filter id="sharpen-light">
          <feConvolveMatrix
            order="3"
            kernelMatrix="0 -0.5 0 -0.5 3 -0.5 0 -0.5 0"
            preserveAlpha="true"
          />
        </filter>
        <!-- Medium sharpen: balanced enhancement -->
        <filter id="sharpen-medium">
          <feConvolveMatrix
            order="3"
            kernelMatrix="0 -1 0 -1 5 -1 0 -1 0"
            preserveAlpha="true"
          />
        </filter>
        <!-- Strong sharpen: aggressive enhancement -->
        <filter id="sharpen-strong">
          <feConvolveMatrix
            order="3"
            kernelMatrix="-1 -1 -1 -1 9 -1 -1 -1 -1"
            preserveAlpha="true"
          />
        </filter>
      </defs>
    </svg>
    
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
